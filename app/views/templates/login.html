{% extends "base.html" %}
{% block titulo %}Iniciar sesión · English Practice{% endblock %}
{% block clase_main %}angosto{% endblock %}
{% block contenido %}
<h1>Inicia sesión</h1>
<p class="subtitulo">Practica inglés con exámenes de 20 preguntas y descubre tu nivel.</p>

<form method="post" class="formulario" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="correo">Correo</label>
  <input id="correo" name="correo" type="email" value="{{ correo }}" autocomplete="email" required autofocus>

  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <button type="submit" class="btn btn-primario">Iniciar sesión</button>
</form>

{% endblock %}
