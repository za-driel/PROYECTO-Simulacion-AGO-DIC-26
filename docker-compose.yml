services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-simulador_ingles}
      MYSQL_USER: ${DB_USER:-simulador}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/simulador_ingles_mysql.sql:/docker-entrypoint-initdb.d/01-simulador.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-simulador}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-simulador_ingles}
      FINAL_MODO_PRUEBA: ${FINAL_MODO_PRUEBA:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
